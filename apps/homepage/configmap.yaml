apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    theme: dark
    color: zinc
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    target: _blank
    backgroundOpacity: 0
    cardBlur: sm
    layout:
      Media:
        style: row
        columns: 2
      Cluster:
        style: row
        columns: 2
  custom.css: |
    html, body {
      background-color: #0f2a1a !important;
      background-image: none !important;
    }
    #__next, main, div[data-testid="home"] {
      background-color: #0f2a1a !important;
    }
    .bg-theme-200\/50 {
      background-color: rgba(30, 41, 35, 0.7) !important;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06);
    }
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/rh-stack/k3s
              icon: github
  services.yaml: |
    - Media:
        - Jellyfin:
            href: http://jf.k3s.lan
            icon: jellyfin
            description: Stream movies and shows
        - qBittorrent:
            href: http://qb.k3s.lan
            icon: qbittorrent
            description: Downloads via NL-FREE#239
    - Cluster:
        - Headlamp:
            href: http://headlamp.k3s.lan
            icon: headlamp
            description: Cluster view
        - Argo CD:
            href: http://argocd.k3s.lan
            icon: argo-cd
            description: GitOps sync
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhcmdvY2QiLCJzdWIiOiJyZWFkb25seTphcGlLZXkiLCJuYmYiOjE3ODgwMDQ1MTcsImlhdCI6MTc4ODAwNDUxNywianRpIjoiYzJiNmJlNzctZjU2ZS00NzdiLTg2MGUtMTgyNTg5Y2NlNzQxIn0.bOORtPJp8UxHJFZf04yaqEV-J0b8c4bCDSMA431PFDY
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: false
          cpu: false
          memory: false
          showLabel: false
    - resources:
        backend: resources
        expanded: true
        cpu: false
        memory: false
        disk: /
        network: false
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
