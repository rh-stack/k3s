apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/rh-stack/k3s
              icon: github
        - Argo CD:
            - abbr: AC
              href: http://argocd.k3s.lan
              icon: argo
  services.yaml: |
    - Media:
        - Jellyfin:
            href: http://jf.k3s.lan
            icon: jellyfin
            description: Media server
        - qBittorrent:
            href: http://qb.k3s.lan
            icon: qbittorrent
            description: Downloader via gluetun
    - Cluster:
        - Homepage:
            href: http://home.k3s.lan
            icon: homepage
            description: Service launcher
        - Headlamp:
            href: http://headlamp.k3s.lan
            icon: headlamp
            description: Cluster dashboard
        - Argo CD:
            href: http://argocd.k3s.lan
            icon: argo
            description: GitOps
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
