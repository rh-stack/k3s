apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    theme: dark
    color: zinc
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    target: _blank
    background: https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=2070
    backgroundOpacity: 35
    cardBlur: sm
    layout:
      Media:
        style: row
        columns: 2
      Cluster:
        style: row
        columns: 2
  custom.css: |
    /* phthalo green background */
    html {
      background-color: #123524 !important;
    }
    body {
      background-color: #123524 !important;
      background-image: none !important;
    }
    /* semitransparent cards */
    .bg-theme-200\/50 {
      background-color: rgba(24, 24, 27, 0.6) !important;
      backdrop-filter: blur(8px);
    }
    /* header widgets on own background */
    #header {
      gap: 0.75rem;
    }
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/rh-stack/k3s
              icon: github
  services.yaml: |
    - Media:
        - Jellyfin:
            href: http://jf.k3s.lan
            icon: jellyfin
            description: Stream movies and shows
        - qBittorrent:
            href: http://qb.k3s.lan
            icon: qbittorrent
            description: Downloads via NL-FREE#239
    - Cluster:
        - Headlamp:
            href: http://headlamp.k3s.lan
            icon: headlamp
            description: Cluster view
        - Argo CD:
            href: http://argocd.k3s.lan
            icon: argocd
            description: GitOps sync
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhcmdvY2QiLCJzdWIiOiJyZWFkb25seTphcGlLZXkiLCJuYmYiOjE3ODgwMDQ1MTcsImlhdCI6MTc4ODAwNDUxNywianRpIjoiYzJiNmJlNzctZjU2ZS00NzdiLTg2MGUtMTgyNTg5Y2NlNzQxIn0.bOORtPJp8UxHJFZf04yaqEV-J0b8c4bCDSMA431PFDY
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: false
          cpu: false
          memory: false
          showLabel: false
    - resources:
        backend: resources
        expanded: false
        cpu: false
        memory: false
        disk: /srv/data
        network: true
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
