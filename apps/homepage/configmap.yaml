apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    theme: dark
    color: zinc
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    target: _blank
    background: https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070
    backgroundOpacity: 35
    cardBlur: sm
    layout:
      Media:
        style: row
        columns: 2
      Cluster:
        style: row
        columns: 3
  custom.css: |
    /* darker semitransparent cards - clean modern */
    .bg-theme-200\/50 {
      background-color: rgba(24, 24, 27, 0.6) !important;
    }
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/rh-stack/k3s
              icon: github
        - Argo CD:
            - abbr: AC
              href: http://argocd.k3s.lan
              icon: argo
  services.yaml: |
    - Media:
        - Jellyfin:
            href: http://jf.k3s.lan
            icon: jellyfin
            description: Stream movies and shows
        - qBittorrent:
            href: http://qb.k3s.lan
            icon: qbittorrent
            description: Downloads via NL-FREE#239
    - Cluster:
        - Homepage:
            href: http://home.k3s.lan
            icon: homepage
            description: This dashboard
        - Headlamp:
            href: http://headlamp.k3s.lan
            icon: headlamp
            description: Cluster view
        - Argo CD:
            href: http://argocd.k3s.lan
            icon: argo
            description: GitOps sync
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: REPLACE_WITH_READONLY_TOKEN
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        disk: /srv/data
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
