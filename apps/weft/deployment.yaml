apiVersion: apps/v1
kind: Deployment
metadata:
  name: weft
  namespace: weft
  labels:
    app: weft
spec:
  revisionHistoryLimit: 3
  replicas: 1
  # Recreate avoids a second pod contending for the same RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weft
  template:
    metadata:
      labels:
        app: weft
    spec:
      # Image is built on this VM and imported into k3s containerd
      # (scripts/import-weft-image.sh). No external registry while single node.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weft
          image: weft:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # Backend has no /health endpoint - /api/state is the health signal.
          readinessProbe:
            httpGet:
              path: /api/state
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/state
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weft-data
