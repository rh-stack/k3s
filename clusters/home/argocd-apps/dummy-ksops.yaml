apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dummy-ksops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rh-stack/k3s.git
    targetRevision: HEAD
    path: apps/dummy-ksops
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
